<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
  body {
    font-family: 'Press Start 2P', system-ui, sans-serif;
    background: linear-gradient(135deg, #ef4444 0%, #ef4444 30%, #fbbf24 30%, #fbbf24 50%, #2563eb 50%, #2563eb 100%);
    background-attachment: fixed;
  }
  .pokedex-panel {
    background: #f8fafc;
  }

  /* Animación de captura: la pokébola aparece y se agranda */
  @keyframes captura-pop {
    0%   { transform: scale(0) rotate(0deg);   opacity: 0; }
    50%  { transform: scale(1.3) rotate(180deg); opacity: 1; }
    75%  { transform: scale(1) rotate(300deg);  opacity: 1; }
    100% { transform: scale(0.3) rotate(360deg); opacity: 0; }
  }
  .pokebola-anim {
    animation: captura-pop 0.7s ease-in-out forwards;
  }
</style>
</head>
<body class="min-h-screen p-6">
  <h1 class="text-2xl md:text-3xl font-bold text-center text-white mb-8 drop-shadow-[3px_3px_0_rgba(0,0,0,0.4)]">
    Pokédex
  </h1>

  <div class="pokedex-panel max-w-4xl mx-auto rounded-2xl shadow-xl p-6 border-4 border-slate-800">

    <div class="max-w-md mx-auto flex gap-2 mb-6">
      <input
        id="buscador"
        type="text"
        placeholder="Busca un Pokémon..."
        class="flex-1 p-2 rounded-lg border-2 border-slate-300 text-sm"
        style="font-family: inherit;"
      >
      <button
        id="btn-buscar"
        class="px-4 py-2 bg-yellow-400 text-slate-800 text-xs rounded-lg border-2 border-slate-800 hover:bg-yellow-300 active:translate-y-0.5">
        Buscar
      </button>
    </div>

    <div id="spinner" class="hidden flex-col items-center justify-center my-6 gap-3">
      <div class="w-12 h-12 rounded-full border-4 border-slate-200 border-t-red-500 animate-spin"></div>
      <span class="text-xs text-slate-500">Cargando…</span>
    </div>

    <div id="mensaje" class="hidden text-center text-red-600 font-medium my-4 text-xs bg-red-50 border-2 border-red-300 rounded-lg py-3 px-2"></div>

    <div
      id="resultado"
      class="grid grid-cols-2 md:grid-cols-3 gap-4">
    </div>

    <div class="text-center mt-8">
      <button
        id="cargar-mas"
        class="px-4 py-2 bg-blue-600 text-white text-xs rounded-lg border-2 border-slate-800 hover:bg-blue-500 active:translate-y-0.5">
        Cargar más
      </button>
    </div>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
